name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest jsonschema
      - run: python -m pytest tools/tests -q

  supabase:
    name: Supabase migration tests
    runs-on: ubuntu-latest
    # A throwaway database from Supabase's own Postgres image (auth schema, API roles,
    # pg_jsonschema); synthetic data only. Never the live project (RFC 7.2.8).
    services:
      postgres:
        image: supabase/postgres:15.8.1.085
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy jsonschema
      - name: Migrations, RLS, schema checks, legacy copy, paging, rollback
        env:
          PGURL: postgres://postgres:postgres@localhost:54322/postgres
        run: supabase/tests/run.sh

  swift:
    name: BarPathKit tests + app builds
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: BarPathKit tests (macOS)
        working-directory: BarPath/BarPathKit
        run: swift test
      - name: Generate Xcode project
        working-directory: BarPath
        run: |
          brew install xcodegen
          xcodegen
      - name: Build iPhone app (with the watch app embedded)
        working-directory: BarPath
        run: |
          xcodebuild build -project BarPath.xcodeproj -scheme BarPath \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > build-ios.log 2>&1 || {
            echo "::group::Compiler errors"; grep -E "error:" build-ios.log | sort -u | head -100; echo "::endgroup::"
            tail -n 40 build-ios.log
            exit 1
          }
          tail -n 5 build-ios.log
      - name: Build watch app
        working-directory: BarPath
        run: |
          xcodebuild build -project BarPath.xcodeproj -scheme BarPathWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > build-watch.log 2>&1 || {
            echo "::group::Compiler errors"; grep -E "error:" build-watch.log | sort -u | head -100; echo "::endgroup::"
            tail -n 40 build-watch.log
            exit 1
          }
          tail -n 5 build-watch.log
